<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" fill="none">
  <!-- Background -->
  <rect width="400" height="350" fill="#EAF7EE" rx="28"/>
  
  <!-- Avocado half -->
  <ellipse cx="280" cy="260" rx="70" ry="55" fill="#6FBF5C"/>
  <ellipse cx="280" cy="260" rx="55" ry="42" fill="#B8E6A0"/>
  <circle cx="280" cy="265" r="22" fill="#8B5E3C"/>
  <circle cx="280" cy="265" r="16" fill="#A0704B"/>
  
  <!-- Tomato -->
  <circle cx="120" cy="240" r="50" fill="#FF6B4A"/>
  <circle cx="120" cy="240" r="42" fill="#FF8A6E"/>
  <path d="M112 192 C115 185, 125 185, 128 192" fill="#3FA84C"/>
  <line x1="120" y1="188" x2="120" y2="178" stroke="#3FA84C" stroke-width="3" stroke-linecap="round"/>
  <path d="M116 180 C118 175, 122 175, 124 180" fill="#4FBF5C"/>
  
  <!-- Lemon -->
  <ellipse cx="200" cy="200" rx="42" ry="28" fill="#FFD23E" transform="rotate(-15 200 200)"/>
  <ellipse cx="200" cy="200" rx="34" ry="22" fill="#FFE066" transform="rotate(-15 200 200)"/>
  
  <!-- Carrot -->
  <rect x="68" y="140" width="18" height="120" rx="9" fill="#FF9B3E" transform="rotate(8 77 200)"/>
  <rect x="70" y="142" width="14" height="116" rx="7" fill="#FFB366" transform="rotate(8 77 200)"/>
  <path d="M72 142 C68 125, 72 115, 77 110" stroke="#3FA84C" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M82 142 C86 128, 82 118, 77 112" stroke="#4FBF5C" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M76 142 C74 130, 77 120, 77 114" stroke="#3FA84C" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Leafy greens / basil -->
  <g transform="translate(300, 130)">
    <ellipse cx="0" cy="0" rx="25" ry="15" fill="#2FAE60" transform="rotate(-30)"/>
    <ellipse cx="15" cy="-10" rx="22" ry="12" fill="#35C978" transform="rotate(-10)"/>
    <ellipse cx="30" cy="0" rx="20" ry="11" fill="#2FAE60" transform="rotate(15)"/>
    <line x1="0" y1="0" x2="35" y2="5" stroke="#1F8F4C" stroke-width="1.5"/>
  </g>
  
  <!-- Berry cluster -->
  <circle cx="160" cy="280" r="12" fill="#7C3AED"/>
  <circle cx="175" cy="275" r="11" fill="#8B5CF6"/>
  <circle cx="168" cy="290" r="10" fill="#7C3AED"/>
  <circle cx="180" cy="288" r="9" fill="#A78BFA"/>
  <circle cx="162" cy="268" r="4" fill="#22C55E"/>
  
  <!-- Broccoli -->
  <g transform="translate(320, 280)">
    <rect x="-3" y="0" width="6" height="25" rx="3" fill="#3FA84C"/>
    <circle cx="-8" cy="-4" r="14" fill="#2FAE60"/>
    <circle cx="8" cy="-4" r="13" fill="#35C978"/>
    <circle cx="0" cy="-12" r="12" fill="#2FAE60"/>
    <circle cx="-12" cy="2" r="10" fill="#1F8F4C"/>
    <circle cx="12" cy="2" r="10" fill="#2FAE60"/>
  </g>
  
  <!-- Apple -->
  <g transform="translate(70, 80)">
    <circle cx="0" cy="0" r="35" fill="#E74C3C"/>
    <circle cx="0" cy="0" r="30" fill="#FF6B5A"/>
    <path d="M0 -30 C2 -40, 8 -42, 6 -35" stroke="#6B4226" stroke-width="3" stroke-linecap="round" fill="none"/>
    <ellipse cx="8" cy="-38" rx="6" ry="4" fill="#3FA84C" transform="rotate(30 8 -38)"/>
  </g>
  
  <!-- Scattered seeds -->
  <circle cx="240" cy="310" r="3" fill="#D4A574"/>
  <circle cx="255" cy="305" r="2.5" fill="#C99B6A"/>
  <circle cx="230" cy="318" r="2" fill="#D4A574"/>
  <circle cx="140" cy="310" r="2.5" fill="#C99B6A"/>
</svg>
