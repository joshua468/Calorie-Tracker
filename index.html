<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Track your daily calorie intake, macros, and nutrition goals with this beautiful calorie tracker app.">
  <title>CalorieFlow — Smart Calorie Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Background Blobs -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header" id="app-header">
      <div class="header-left">
        <div class="logo">
          <div class="logo-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" fill="url(#logoGrad)" stroke="none"/>
              <path d="M12 6v6l4 2" stroke="white" stroke-width="2"/>
              <defs>
                <linearGradient id="logoGrad" x1="0" y1="0" x2="24" y2="24">
                  <stop offset="0%" stop-color="#6366f1"/>
                  <stop offset="100%" stop-color="#a855f7"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <h1 class="logo-text">Calorie<span>Flow</span></h1>
        </div>
      </div>
      <div class="header-right">
        <button class="btn-icon" id="btn-settings" aria-label="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.32 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Date Navigation -->
    <div class="date-nav" id="date-nav">
      <button class="btn-icon btn-date-arrow" id="btn-prev-day" aria-label="Previous day">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <div class="date-display" id="date-display">
        <span class="date-label" id="date-label">Today</span>
        <span class="date-full" id="date-full">May 24, 2026</span>
      </div>
      <button class="btn-icon btn-date-arrow" id="btn-next-day" aria-label="Next day">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    </div>

    <!-- Main Dashboard -->
    <main class="dashboard">
      <!-- Calorie Ring Card -->
      <section class="card card-ring" id="card-ring">
        <div class="ring-container">
          <svg class="progress-ring" viewBox="0 0 200 200" id="progress-ring-svg">
            <defs>
              <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#6366f1"/>
                <stop offset="50%" stop-color="#a855f7"/>
                <stop offset="100%" stop-color="#ec4899"/>
              </linearGradient>
            </defs>
            <circle class="ring-bg" cx="100" cy="100" r="85" />
            <circle class="ring-progress" cx="100" cy="100" r="85" id="ring-progress" />
          </svg>
          <div class="ring-content">
            <span class="ring-consumed" id="ring-consumed">0</span>
            <span class="ring-separator">of</span>
            <span class="ring-goal" id="ring-goal">2000</span>
            <span class="ring-unit">kcal</span>
          </div>
        </div>
        <div class="ring-stats">
          <div class="ring-stat">
            <span class="ring-stat-value positive" id="remaining-cal">2000</span>
            <span class="ring-stat-label">Remaining</span>
          </div>
          <div class="ring-stat-divider"></div>
          <div class="ring-stat">
            <span class="ring-stat-value" id="burned-cal">0</span>
            <span class="ring-stat-label">Burned</span>
          </div>
        </div>
      </section>

      <!-- Macros Card -->
      <section class="card card-macros" id="card-macros">
        <h2 class="card-title">Macronutrients</h2>
        <div class="macros-grid">
          <div class="macro-item">
            <div class="macro-header">
              <div class="macro-dot protein"></div>
              <span class="macro-name">Protein</span>
              <span class="macro-value"><span id="protein-consumed">0</span>/<span id="protein-goal">150</span>g</span>
            </div>
            <div class="macro-bar-track">
              <div class="macro-bar protein" id="protein-bar" style="width: 0%"></div>
            </div>
          </div>
          <div class="macro-item">
            <div class="macro-header">
              <div class="macro-dot carbs"></div>
              <span class="macro-name">Carbs</span>
              <span class="macro-value"><span id="carbs-consumed">0</span>/<span id="carbs-goal">250</span>g</span>
            </div>
            <div class="macro-bar-track">
              <div class="macro-bar carbs" id="carbs-bar" style="width: 0%"></div>
            </div>
          </div>
          <div class="macro-item">
            <div class="macro-header">
              <div class="macro-dot fat"></div>
              <span class="macro-name">Fat</span>
              <span class="macro-value"><span id="fat-consumed">0</span>/<span id="fat-goal">65</span>g</span>
            </div>
            <div class="macro-bar-track">
              <div class="macro-bar fat" id="fat-bar" style="width: 0%"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- Meal Sections -->
      <section class="card card-meals" id="card-meals">
        <div class="meals-header">
          <h2 class="card-title">Today's Meals</h2>
          <button class="btn-add-meal" id="btn-add-entry" aria-label="Add food entry">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            <span>Add Food</span>
          </button>
        </div>

        <!-- Meal Category Tabs -->
        <div class="meal-tabs" id="meal-tabs">
          <button class="meal-tab active" data-meal="breakfast" id="tab-breakfast">
            <span class="meal-tab-emoji">🌅</span>
            <span class="meal-tab-name">Breakfast</span>
            <span class="meal-tab-cal" id="cal-breakfast">0</span>
          </button>
          <button class="meal-tab" data-meal="lunch" id="tab-lunch">
            <span class="meal-tab-emoji">☀️</span>
            <span class="meal-tab-name">Lunch</span>
            <span class="meal-tab-cal" id="cal-lunch">0</span>
          </button>
          <button class="meal-tab" data-meal="dinner" id="tab-dinner">
            <span class="meal-tab-emoji">🌙</span>
            <span class="meal-tab-name">Dinner</span>
            <span class="meal-tab-cal" id="cal-dinner">0</span>
          </button>
          <button class="meal-tab" data-meal="snacks" id="tab-snacks">
            <span class="meal-tab-emoji">🍿</span>
            <span class="meal-tab-name">Snacks</span>
            <span class="meal-tab-cal" id="cal-snacks">0</span>
          </button>
        </div>

        <!-- Food Entries List -->
        <div class="food-list" id="food-list">
          <div class="food-empty" id="food-empty">
            <div class="food-empty-icon">🍽️</div>
            <p>No entries yet</p>
            <span>Tap "Add Food" to log your meal</span>
          </div>
        </div>
      </section>

      <!-- Quick Add Section -->
      <section class="card card-quick" id="card-quick">
        <h2 class="card-title">Quick Add</h2>
        <div class="quick-grid" id="quick-grid">
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- Weekly Overview -->
      <section class="card card-weekly" id="card-weekly">
        <h2 class="card-title">Weekly Overview</h2>
        <div class="weekly-chart" id="weekly-chart">
          <!-- Populated by JS -->
        </div>
      </section>
    </main>
  </div>

  <!-- Add Food Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal-add-food">
      <div class="modal-header">
        <h2>Add Food Entry</h2>
        <button class="btn-icon modal-close" id="modal-close" aria-label="Close modal">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <form class="modal-form" id="food-form">
        <div class="form-group">
          <label for="food-name">Food Name</label>
          <input type="text" id="food-name" placeholder="e.g. Grilled Chicken Breast" required autocomplete="off">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="food-calories">Calories</label>
            <input type="number" id="food-calories" placeholder="0" min="0" required>
          </div>
          <div class="form-group">
            <label for="food-serving">Servings</label>
            <input type="number" id="food-serving" placeholder="1" min="0.1" step="0.1" value="1">
          </div>
        </div>
        <div class="form-row form-row-3">
          <div class="form-group">
            <label for="food-protein">Protein (g)</label>
            <input type="number" id="food-protein" placeholder="0" min="0" step="0.1">
          </div>
          <div class="form-group">
            <label for="food-carbs">Carbs (g)</label>
            <input type="number" id="food-carbs" placeholder="0" min="0" step="0.1">
          </div>
          <div class="form-group">
            <label for="food-fat">Fat (g)</label>
            <input type="number" id="food-fat" placeholder="0" min="0" step="0.1">
          </div>
        </div>
        <div class="form-group">
          <label for="food-meal">Meal</label>
          <div class="select-wrapper">
            <select id="food-meal">
              <option value="breakfast">🌅 Breakfast</option>
              <option value="lunch">☀️ Lunch</option>
              <option value="dinner">🌙 Dinner</option>
              <option value="snacks">🍿 Snacks</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn-primary" id="btn-submit-food">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          Add Entry
        </button>
      </form>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settings-overlay">
    <div class="modal" id="modal-settings">
      <div class="modal-header">
        <h2>Goals & Settings</h2>
        <button class="btn-icon modal-close" id="settings-close" aria-label="Close settings">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <form class="modal-form" id="settings-form">
        <div class="form-group">
          <label for="goal-calories">Daily Calorie Goal</label>
          <input type="number" id="goal-calories" placeholder="2000" min="500" max="10000" required>
        </div>
        <div class="form-row form-row-3">
          <div class="form-group">
            <label for="goal-protein">Protein (g)</label>
            <input type="number" id="goal-protein" placeholder="150" min="0">
          </div>
          <div class="form-group">
            <label for="goal-carbs">Carbs (g)</label>
            <input type="number" id="goal-carbs" placeholder="250" min="0">
          </div>
          <div class="form-group">
            <label for="goal-fat">Fat (g)</label>
            <input type="number" id="goal-fat" placeholder="65" min="0">
          </div>
        </div>
        <div class="form-group">
          <label for="goal-burned">Calories Burned Today</label>
          <input type="number" id="goal-burned" placeholder="0" min="0">
        </div>
        <div class="form-divider"></div>
        <div class="form-group">
          <label>Danger Zone</label>
          <button type="button" class="btn-danger" id="btn-clear-today">Clear Today's Entries</button>
          <button type="button" class="btn-danger btn-danger-all" id="btn-clear-all">Clear All Data</button>
        </div>
        <button type="submit" class="btn-primary" id="btn-save-settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          Save Settings
        </button>
      </form>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <script src="script.js"></script>
</body>
</html>
